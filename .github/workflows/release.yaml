name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"
    workflow_dispatch:
        inputs:
            version:
                description: 'Version number (e.g. 0.11.0-beta.1)'
                required: true
            prerelease:
                description: 'Mark as pre-release (for testing)'
                type: boolean
                required: true
                default: true
            draft:
                description: 'Create as draft (not publicly visible)'
                type: boolean
                required: false
                default: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  IS_MANUAL="${{ github.event_name == 'workflow_dispatch' }}"
                  if [ "$IS_MANUAL" = "true" ]; then
                    tag="${{ inputs.version }}"
                    IS_PRERELEASE="${{ inputs.prerelease }}"
                    IS_DRAFT="${{ inputs.draft }}"
                  else
                    tag="${GITHUB_REF#refs/tags/}"
                    IS_PRERELEASE="true"
                    IS_DRAFT="true"
                  fi

                  FLAGS=(--title="$tag")
                  [ "$IS_PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
                  [ "$IS_DRAFT" = "true" ] && FLAGS+=(--draft)

                  gh release create "$tag" \
                    "${FLAGS[@]}" \
                    main.js manifest.json styles.css
